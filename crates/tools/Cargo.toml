[package]
name = "blockcell-tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
napcat = ["blockcell-channels/napcat"]

[dependencies]
blockcell-core = { path = "../core" }
blockcell-skills = { path = "../skills" }
blockcell-storage = { path = "../storage" }
blockcell-channels = { path = "../channels", optional = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
regex = { workspace = true }
glob = { workspace = true }
ignore = { workspace = true }
reqwest = { workspace = true }
scraper = { workspace = true }
htmd = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
cron = { workspace = true }
dirs = { workspace = true }
calamine = { workspace = true }
zip = { workspace = true }
quick-xml = { workspace = true }
docx-rs = { workspace = true }
image = { workspace = true }
which = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
pdf-extract = { workspace = true }
csv = { workspace = true }
lettre = { workspace = true }
async-imap = { workspace = true }
tokio-rustls = { workspace = true }
rustls-native-certs = { workspace = true }
tokio-util = { workspace = true }
base64 = { workspace = true }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
once_cell = { workspace = true }
urlencoding = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }
aes = "0.8"
cbc = { version = "0.1", features = ["block-padding"] }
cipher = { version = "0.4", features = ["alloc"] }
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
