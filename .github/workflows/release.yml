name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.2 or v1.0.2)"
        required: true

env:
  RUST_VERSION: "1.96.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      workspace_version: ${{ steps.version.outputs.workspace_version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate release version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          release_tag="$REQUESTED_VERSION"
          [[ "$release_tag" == v* ]] || release_tag="v$release_tag"

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $release_tag" >&2
            exit 1
          fi

          workspace_version=$(awk '
            /^\[workspace.package\]$/ { section = 1; next }
            /^\[/ { section = 0 }
            section && /^version[[:space:]]*=/ {
              value = $0
              sub(/^[^"]*"/, "", value)
              sub(/".*$/, "", value)
              print value
              exit
            }
          ' Cargo.toml)

          if [[ -z "$workspace_version" ]]; then
            echo "Unable to read [workspace.package] version from Cargo.toml" >&2
            exit 1
          fi
          release_version="${release_tag#v}"
          if [[ "$release_version" != "$workspace_version" ]]; then
            echo "Release version $release_version does not match Cargo workspace version $workspace_version" >&2
            exit 1
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "workspace_version=$workspace_version" >> "$GITHUB_OUTPUT"

  webui:
    needs: prepare
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Test and build WebUI
        working-directory: webui
        run: |
          npm ci
          npm test
          npm run build

      - name: Upload WebUI build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: webui-dist
          path: webui/dist
          if-no-files-found: error

  build:
    needs: [prepare, webui]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (arm64)
          - os: macos-15
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
            binary: blockcell
            archive_ext: tar.gz
            updater_ext: .updater
            deployment_target: "11.0"

          # macOS Intel (x86_64) — native Intel runner
          - os: macos-15-intel
            target: x86_64-apple-darwin
            platform: darwin
            arch: amd64
            binary: blockcell
            archive_ext: tar.gz
            updater_ext: .updater
            deployment_target: "10.15"

          # Linux x86_64 (musl — fully static, no glibc dependency)
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            platform: linux
            arch: amd64
            binary: blockcell
            archive_ext: tar.gz
            updater_ext: .updater

          # Windows x86_64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: amd64
            binary: blockcell.exe
            archive_ext: zip
            updater_ext: .exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # The Rust binary embeds webui/dist. Use the tested build produced from the
      # same release commit instead of trusting committed build output.
      - name: Remove committed WebUI build
        shell: bash
        run: rm -rf webui/dist && mkdir -p webui/dist

      - name: Download WebUI build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: webui-dist
          path: webui/dist

      # ── Rust toolchain ────────────────────────────────────────────────────
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          key: ${{ matrix.target }}

      # ── Platform-specific dependencies ───────────────────────────────────
      - name: Install Linux deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get install -y ca-certificates musl-tools musl-dev pkg-config perl make gcc g++ protobuf-compiler
          else
            sudo apt-get install -y ca-certificates pkg-config libssl-dev protobuf-compiler
          fi

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install OpenSSL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install openssl protoc --no-progress -y
          echo "OPENSSL_DIR=C:\Program Files\OpenSSL-Win64" >> $env:GITHUB_ENV
          echo "OPENSSL_STATIC=1" >> $env:GITHUB_ENV

      # ── Build ─────────────────────────────────────────────────────────────
      - name: Build release binary
        shell: bash
        env:
          RUSTFLAGS: ${{ matrix.target == 'x86_64-unknown-linux-musl' && '-C target-feature=+crt-static' || '' }}
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          # thin LTO is much faster than fat LTO with negligible quality loss
          CARGO_PROFILE_RELEASE_LTO: thin
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
          # Ensure C build scripts (lz4-sys, blake3, etc.) target the same macOS
          # version as the Rust linker; avoids "built for newer macOS" linker errors
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target || '' }}
          # Optional repository variable containing the trusted 32-byte Ed25519 public key.
          # When present it is embedded into AutoUpgradeConfig at compile time.
          BLOCKCELL_UPDATER_PUBLIC_KEY: ${{ vars.BLOCKCELL_UPDATER_PUBLIC_KEY }}
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            export OPENSSL_VENDORED=1
            export OPENSSL_STATIC=1
          fi
          cargo build --release --locked --target ${{ matrix.target }} --bin blockcell

      # ── Package ───────────────────────────────────────────────────────────

      - name: Package (Unix — tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          PKG="blockcell-${{ needs.prepare.outputs.release_tag }}-${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "dist/$PKG"
          cp "$BIN" "dist/$PKG/"
          [ -f README.md ] && cp README.md "dist/$PKG/" || true
          [ -f LICENSE ]   && cp LICENSE   "dist/$PKG/" || true
          cd dist
          tar -czf "${PKG}.tar.gz" "$PKG"
          echo "ASSET=${PKG}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows — zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $BIN  = "target\${{ matrix.target }}\release\${{ matrix.binary }}"
          $PKG  = "blockcell-${{ needs.prepare.outputs.release_tag }}-${{ matrix.platform }}-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force -Path "dist\$PKG" | Out-Null
          Copy-Item $BIN "dist\$PKG\"
          if (Test-Path README.md) { Copy-Item README.md "dist\$PKG\" }
          if (Test-Path LICENSE)   { Copy-Item LICENSE   "dist\$PKG\" }

          # Windows usage note
          @"
          Windows 下载/运行说明（重要）

          从 GitHub Release 下载的 .zip/.exe 可能被 Windows 标记为"来自互联网"(MOTW)，
          导致弹出 SmartScreen 警告或启动缓慢。

          解决办法（任选其一）：
          1) 右键 zip -> 属性 -> 勾选"解除锁定(Unblock)" -> 应用，再解压
          2) 解压后右键 exe -> 属性 -> "解除锁定(Unblock)" -> 应用
          3) PowerShell: Get-ChildItem -Recurse | Unblock-File
          "@ | Out-File -Encoding utf8 "dist\$PKG\README-WINDOWS.txt"

          Compress-Archive -Path "dist\$PKG\*" -DestinationPath "dist\${PKG}.zip"
          echo "ASSET=${PKG}.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The updater installs a single executable. Keep the archives for people who download
      # releases manually, and publish a separate raw binary for manifest consumers.
      - name: Prepare raw updater binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          UPDATER="blockcell-${{ needs.prepare.outputs.release_tag }}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.updater_ext }}"
          cp "$BIN" "dist/$UPDATER"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: blockcell-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/blockcell-*.${{ matrix.archive_ext }}
            dist/blockcell-*${{ matrix.updater_ext }}
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Create and push tag (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          current_commit=$(git rev-parse HEAD)

          remote_refs=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          remote_commit=$(printf '%s\n' "$remote_refs" | awk '$2 ~ /\^\{\}$/ { print $1; exit }')
          if [[ -z "$remote_commit" ]]; then
            remote_commit=$(printf '%s\n' "$remote_refs" | awk '{ print $1; exit }')
          fi

          if [[ -n "$remote_commit" ]]; then
            if [[ "$remote_commit" != "$current_commit" ]]; then
              echo "Tag $TAG points to a different commit ($remote_commit instead of $current_commit)" >&2
              exit 1
            fi
            echo "Tag $TAG already exists on origin at the current commit, skipping push."
          else
            if git rev-parse "$TAG^{}" >/dev/null 2>&1; then
              local_commit=$(git rev-parse "$TAG^{}")
              if [[ "$local_commit" != "$current_commit" ]]; then
                echo "Local tag $TAG points to a different commit ($local_commit instead of $current_commit)" >&2
                exit 1
              fi
            else
              git tag -a "$TAG" -m "Release $TAG"
            fi
            git push origin "refs/tags/$TAG"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts/

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          find . -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.updater" -o -name "*.exe" \) | sort | while read f; do
            printf '%s  %s\n' "$(sha256sum "$f" | awk '{print $1}')" "$(basename "$f")"
          done > ../checksums.txt
          cat ../checksums.txt

      - name: Generate updater manifest.json
        shell: bash
        env:
          UPDATER_PRIVATE_KEY: ${{ secrets.BLOCKCELL_UPDATER_PRIVATE_KEY }}
          UPDATER_PUBLIC_KEY: ${{ vars.BLOCKCELL_UPDATER_PUBLIC_KEY }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          REPO="${{ github.repository }}"

          if { [[ -n "$UPDATER_PRIVATE_KEY" ]] && [[ -z "$UPDATER_PUBLIC_KEY" ]]; } \
            || { [[ -z "$UPDATER_PRIVATE_KEY" ]] && [[ -n "$UPDATER_PUBLIC_KEY" ]]; }; then
            echo "BLOCKCELL_UPDATER_PRIVATE_KEY secret and BLOCKCELL_UPDATER_PUBLIC_KEY variable must be configured together" >&2
            exit 1
          fi
          if [[ -n "$UPDATER_PRIVATE_KEY" ]]; then
            printf '%s' "$UPDATER_PRIVATE_KEY" > updater-signing-key.pem
            trap 'rm -f updater-signing-key.pem' EXIT
          fi

          artifacts_json="[]"

          while IFS= read -r line; do
            sha="$(echo "$line" | awk '{print $1}')"
            path="$(echo "$line" | awk '{print $2}')"
            file="$(basename "$path")"

            if [[ "$file" =~ ^blockcell-${TAG}-darwin-arm64\\.updater$ ]]; then
              os="macos"; arch="aarch64"
            elif [[ "$file" =~ ^blockcell-${TAG}-darwin-amd64\\.updater$ ]]; then
              os="macos"; arch="x86_64"
            elif [[ "$file" =~ ^blockcell-${TAG}-linux-amd64\\.updater$ ]]; then
              os="linux"; arch="x86_64"
            elif [[ "$file" =~ ^blockcell-${TAG}-windows-amd64\\.exe$ ]]; then
              os="windows"; arch="x86_64"
            else
              continue
            fi

            url="https://github.com/${REPO}/releases/download/${TAG}/${file}"
            sig=""
            if [[ -n "$UPDATER_PRIVATE_KEY" ]]; then
              payload=$(jq -nc \
                --arg schema "blockcell-update-v1" \
                --arg channel "stable" \
                --arg version "$TAG" \
                --arg os "$os" \
                --arg arch "$arch" \
                --arg url "$url" \
                --arg sha256 "$sha" \
                '{schema:$schema,channel:$channel,version:$version,os:$os,arch:$arch,url:$url,sha256:$sha256}')
              sig=$(printf '%s' "$payload" \
                | openssl pkeyutl -sign -rawin -inkey updater-signing-key.pem \
                | base64 -w0)
            fi
            artifacts_json=$(echo "$artifacts_json" | jq -c \
              --arg os "$os" \
              --arg arch "$arch" \
              --arg url "$url" \
              --arg sha256 "$sha" \
              --arg sig "$sig" \
              '. + [({os:$os, arch:$arch, url:$url, sha256:$sha256}
                + if $sig == "" then {} else {sig:$sig} end)]')
          done < checksums.txt

          jq -n -c \
            --arg channel "stable" \
            --arg version "$TAG" \
            --arg publishedAt "$PUBLISHED_AT" \
            --arg notes "" \
            --argjson artifacts "$artifacts_json" \
            '{channel:$channel, version:$version, publishedAt:$publishedAt, artifacts:$artifacts, notes:$notes}' \
            > manifest.json

          cat manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: "blockcell ${{ needs.prepare.outputs.release_tag }}"
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.release_tag, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.updater
            artifacts/**/*.exe
            checksums.txt
            manifest.json
