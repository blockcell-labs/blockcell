name: Genesis macOS regression
on:
  pull_request:
    paths: ['genesis/**', '.github/workflows/genesis.yml']
  push:
    branches: [main]
    paths: ['genesis/**', '.github/workflows/genesis.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - name: Verify native sandbox
        run: sandbox-exec -p '(version 1) (allow default)' /usr/bin/true
      - name: Standard-library regression (no provider credential)
        run: python -m unittest discover -s genesis/tests -v
      - name: Compile Python sources
        run: python -m compileall -q genesis
